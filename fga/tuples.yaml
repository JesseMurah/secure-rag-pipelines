# The entire permission database. 27 lines of relationships.
#
# Read this on stage. The point to make: there is no permission column
# on the agent records, and no role table. Just relationships.

# ── National scope: ONE tuple ────────────────────────────────────────
# Ama is a national analyst at the org. That single line is what grants
# her every agent record — now and every record added in future.
- user: user:ama
  relation: national_analyst
  object: organization:mtn_ghana

# ── Territories belong to the org ────────────────────────────────────
# This is the hop that makes Ama's one tuple reach the agents.
- user: organization:mtn_ghana
  relation: organization
  object: territory:kumasi
- user: organization:mtn_ghana
  relation: organization
  object: territory:accra
- user: organization:mtn_ghana
  relation: organization
  object: territory:tamale
- user: organization:mtn_ghana
  relation: organization
  object: territory:takoradi

# ── Field officers: one tuple each, scoped to a territory ────────────
- user: user:kwame
  relation: field_officer
  object: territory:kumasi
- user: user:yaw
  relation: field_officer
  object: territory:accra

